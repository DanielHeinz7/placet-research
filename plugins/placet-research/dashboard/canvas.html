      groups.get(g.number).gaps.push(g);
    });
    return '<details class="agenda-gaps"><summary>Not answered yet <span class="agenda-gap-count">'
      + gaps.length + (gaps.length === 1 ? ' question in ' : ' questions in ')
      + groups.size + (groups.size === 1 ? ' field' : ' fields') + '</span> <span class="agenda-gap-count">(expand to see the questions)</span></summary>'
      + '<ul class="agenda-gap-fields">' + Array.from(groups.values()).map(renderGapField).join('') + '</ul></details>';
  }

  function historyLabel(kind) {
    if (kind === 'DISCOVERY') return 'To talk about';
    if (kind === 'CONSTRAINT') return 'Constraint';
    if (kind === 'DECISION') return 'Decision';
    return kind ? (kind.charAt(0) + kind.slice(1).toLowerCase()) : 'Entry';
  }

  // The entry hooks/lib/choose.js writes when the researcher picks a framing:
  // a DECISION whose ref is `framing chosen: <variant name>`.
  var FRAMING_REF = /^framing chosen: (.+)$/;

  // Each entry carries its `#seq`: "Open at acceptance" names entries by it,
  // and its links land on the card with that id.
  // What the server's seal check says about one entry (sealStatus, the verdicts
  // of hooks/lib/review.js). Intact entries need no integrity label.
  var SEAL_STATE = { broken: 'Record changed', legacy: 'Older record; cannot check for changes', unverifiable: 'Cannot check for changes on this device' };
  var BREAK_WHY = {
    unsealed: 'an entry without a change record was added',
    anchor: 'this entry or earlier unchecked entries changed',
    chain: 'earlier entries are missing or were removed',
    content: 'this entry\'s heading or text changed',
    key: 'the key on this device is not the project\'s',
    'line-endings': 'the file has Windows line endings, which placet-research cannot read'
  };

  function brokenAt(s) {
    var ledger = s.review && s.review.ledger;
    return ledger && ledger.status === 'broken' && ledger.broken ? ledger.broken : null;
  }

  // A DECISION that does not verify is marked in words, not only in colour: a
  // forged `framing chosen` or accept must not read like the researcher's own.
  function sealFlag(d, s) {
    if (d.kind !== 'DECISION' || !d.sealStatus || d.sealStatus === 'verified') return '';
    var at = brokenAt(s);
    var why;
    if (d.sealStatus === 'legacy') why = 'it predates checks for changes';
    else if (d.sealStatus === 'unverifiable') why = 'changes cannot be checked on this device';
    // A wrong key leaves no entry changed, so no entry number belongs here.
    else if (at && at.why === 'key') why = BREAK_WHY.key;
    else if (at && at.seq === d.seq) why = 'the saved history changed here: ' + (BREAK_WHY[at.why] || 'the saved record no longer matches');
    else why = 'it follows a changed entry' + (at ? ' at #' + at.seq : '');
    return '<p class="seal-flag" role="note"><span aria-hidden="true">&#9888;</span> Decision record cannot be confirmed: ' + esc(why) + '.</p>';
  }

  function renderHistory(s) {
    var buttons = [null].concat(namesIn(s.decisions)).map(function (name) {
      return '<button type="button" class="ghost-btn" data-by="' + esc(name === null ? '' : name)
        + '" aria-pressed="' + (name === byFilter ? 'true' : 'false') + '">' + esc(name === null ? 'All' : name) + '</button>';
    }).join('');
    var rows = s.decisions.map(function (d) {
      if (d.kind === 'SESSION') {
        return '<li id="entry-' + esc(d.seq) + '" tabindex="-1"><div role="separator" class="session-divider">Session: '
          + esc(d.ref) + ' &middot; ' + esc(d.date) + renderEntryBy(d) + '</div></li>';
      }
      if (!passesFilter(d)) return '';
      if (d.kind === 'MERGE') {
        return '<li id="entry-' + esc(d.seq) + '" tabindex="-1"><p class="merge-line">Merged from '
          + esc((d.ref || '').replace(/^from /, '')) + ' &mdash; ' + esc((d.body || '').split('\n')[0])
          + renderEntryBy(d) + '</p></li>';
      }
      var framing = d.kind === 'DECISION' ? FRAMING_REF.exec(d.ref || '') : null;
      return '<li class="history-card" id="entry-' + esc(d.seq) + '" tabindex="-1"><p class="history-meta">#' + esc(d.seq) + ' &middot; '
        + esc(framing ? 'Framing chosen' : historyLabel(d.kind)) + ' &middot; ' + esc(d.date) + ' &middot; ' + esc(framing ? framing[1] : refToQuestion(d.ref))
        + (SEAL_STATE[d.sealStatus] ? ' &middot; ' + esc(SEAL_STATE[d.sealStatus]) : '') + '</p>'
        + sealFlag(d, s)
        + '<p class="history-body">' + renderEntryBody(d.body) + renderEntryBy(d) + '</p>'
        + '</li>';
    }).join('');
    return '<section id="log" data-view="log" class="view page-section">'
      + '<div class="view-head"><h1 tabindex="-1">History</h1><p class="view-sub">What has been said and decided, in order.</p></div>'
      + '<div class="by-filter" role="group" aria-label="Show entries by">' + buttons + '</div>'
      + (rows ? '<ol class="history-list">' + rows + '</ol>' : '<p class="empty-note">Nothing yet.</p>')
      + '</section>';
  }

  function renderFooter(s) {
    return '<footer class="page-section print-only"><p>placet-research ' + esc(s.version || 'unknown') + ' &middot; Canvas after Dorobantu et al. 2024</p></footer>';
  }

  function renderStagePanels(s) {
    return renderPoster(s) + renderCompare(s) + renderAgenda(s) + s.elements.map(function (e) { return renderField(e, s.elements.length); }).join('') + renderHistory(s);
  }

  function render() {
    // A stale fragment must not leave the filter bar with no active button.
    if (byFilter !== null && namesIn(state.decisions).indexOf(byFilter) < 0) {
      byFilter = null;
      writeByFilter();
    }
    // The Framings tab exists while the project holds variants; once the last
    // one is gone a reload must not leave the reader on a view with no tab.
    if (activeView === 'compare' && !variantsOf(state).length) activeView = 'poster';
    app.innerHTML = renderTopbar(state)
      + renderNotices(state)
      + '<div id="body-shell"><main id="stage" tabindex="-1">' + renderStagePanels(state) + '</main></div>'
      + renderFooter(state);
    applyActiveView();
    if (presentField !== null) paintPresent();
  }

  function renderNotices(s) {
    var notices = [];
    if (s.profileError) notices.push('<p>Profile: ' + esc(s.profileError) + '</p>');
    if (s.keyError) notices.push('<p>Decision history check: ' + esc(s.keyError) + '</p>');
    var broken = brokenAt(s);
    if (broken) {
      // A wrong key leaves every entry unconfirmed without any entry having
      // changed, so this notice names the key and links to no entry (SQ-294).
      notices.push(broken.why === 'key'
        ? '<p>Decision history cannot be checked here: ' + esc(BREAK_WHY.key) + '.</p>'
        : '<p>Decision history has changed. The first affected entry is <button type="button" class="seq-link" data-view-target="log" data-scroll-to="entry-' + esc(broken.seq) + '">#' + esc(broken.seq) + '</button> ('
          + esc(BREAK_WHY[broken.why] || 'the saved record no longer matches') + '). Every entry from there on is marked in History. The original record is not restored automatically.</p>');
    }
    if (!notices.length) return '';
    return '<div class="notices-banner" role="alert">' + notices.join('') + '</div>';
  }

  function applyActiveView() {
    // The shell may name a tab before the first render has drawn the field chips.
    var fieldnav = document.getElementById('fieldnav');
    if (fieldnav) fieldnav.hidden = activeView === 'agenda' || activeView === 'log';
    var views = app.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) {
      views[i].classList.toggle('active', views[i].getAttribute('data-view') === activeView);
    }
    var tabs = app.querySelectorAll('.segment');
    for (i = 0; i < tabs.length; i++) {
      var tabMatch = tabs[i].getAttribute('data-view-target') === activeView;
      tabs[i].classList.toggle('active', tabMatch);
      if (tabMatch) tabs[i].setAttribute('aria-current', 'page');
      else tabs[i].removeAttribute('aria-current');
    }
    // A chip is current while its field is open in the element view.
    var chips = app.querySelectorAll('.chip');
    for (i = 0; i < chips.length; i++) {
      if (activeView === 'element-' + chips[i].getAttribute('data-chip')) chips[i].setAttribute('aria-current', 'true');
      else chips[i].removeAttribute('aria-current');
    }
    scheduleLayout();
  }

  function focusActiveHeading() {
    var heading = app.querySelector('.view.active h1');
    if (heading) heading.focus();
  }

  function fetchState() {
    var url = fixtureMode ? fixturePath : '/api/state';
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('failed to load state (' + r.status + ')');
      return r.json();
    });
  }

  // `moved` names a query that was just accepted: where the browser can, its
  // text travels into the column, the leader line retracts, and the page
  // changes at once under prefers-reduced-motion.
  function refreshState(moved) {
    return fetchState().then(function (s) {
      var apply = function () {
        state = s;
        HUMAN_QUESTIONS = s.humanQuestions || {};
        noteChanges(s);
        render();
        layoutIn(app);
        var arrived = moved && document.getElementById('st-' + moved.num);
        var text = arrived && arrived.querySelector('.stext');
        if (text) text.style.viewTransitionName = 'sq-moved';
      };
      var calm = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (moved && !calm && typeof document.startViewTransition === 'function') {
        return document.startViewTransition(apply).finished.catch(function () {});
      }
      apply();
    });
  }

  // The query behind an accept, tagged so the view transition can follow it.
  function tagMoved(what) {
    var query = app.querySelector('.query[data-question="' + what.questionId + '"][data-hash="' + what.hash + '"]');
    if (!query) return null;
    var text = query.querySelector('.qtext');
    var line = query.closest('.proof').querySelector('.leader[data-q="' + query.id + '"]');
    if (text) text.style.viewTransitionName = 'sq-moved';
    if (line) line.style.viewTransitionName = 'sq-leader';
    return { num: query.getAttribute('data-num') };
  }

  function post(path, payload) {
    return fetch(path, {
      method: 'POST',
      headers: { 'X-Harness-Token': token || '', 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (json) { return { status: r.status, json: json }; });
    });
  }

  // Trades the code from the URL for the write token. A refusal means someone
  // else redeemed the code first (or it expired, or this is a reload): the
  // human has to see that, not a view that silently cannot write.
  function openSession() {
    if (!sessionCode) { showNotice(LINK_USED); return; }
    post('/api/session', { code: sessionCode }).then(function (res) {
      if (res.status === 200 && res.json && res.json.ok && res.json.token) token = res.json.token;
      else showNotice(LINK_USED);
    }).catch(function (err) {
      showNotice('Could not open the session: ' + err.message);
    });
    sessionCode = null;
  }

  function fieldError(field, message) {
    if (!field) return;
    field.setAttribute('aria-invalid', 'true');
    var box = document.getElementById(field.getAttribute('aria-describedby'));
    if (box) box.textContent = message;
    field.focus();
  }

  function doPost(path, payload, field) {
    if (!token) { showNotice(LINK_USED); return; }
    post(path, payload).then(function (res) {
      if (res.status === 200 && res.json && res.json.ok) {
        return refreshState().then(focusActiveHeading);
      }
      if (res.status === 409) {
        showNotice('The canvas changed since this view loaded; reloading.');
        return refreshState().then(focusActiveHeading);
      }
      var message = (res.json && res.json.error) || ('Request failed (' + res.status + ').');
      if (field) fieldError(field, message);
      else showNotice(message);
    }).catch(function (err) {
      if (field) fieldError(field, 'Request failed: ' + err.message);
      else showNotice('Request failed: ' + err.message);
    });
  }

  // -- Dialogs ----------------------------------------------------------
  // Accept and choose each ask for a sentence of the researcher's own, so both
  // go through the one <dialog>. The dialog shows what the server answered
  // when it refuses (a label line in the text, a [stated] statement in the
  // way) inside itself: the notice bar sits under a modal dialog.
  var dlg = document.getElementById('dlg');
  var dialogState = null;
  var dialogBusy = false;

  function findStatement(s, questionId, hash) {
    for (var i = 0; i < s.elements.length; i++) {
      var qs2 = s.elements[i].questions;
      for (var j = 0; j < qs2.length; j++) {
        if (qs2[j].id !== questionId) continue;
        for (var k = 0; k < qs2[j].statements.length; k++) {
          if (qs2[j].statements[k].hash === hash) return { question: qs2[j], statement: qs2[j].statements[k] };
        }
      }
    }
    return null;
  }

  function showDialog(markup, what) {
    dialogState = what;
    dialogBusy = false;
    dlg.innerHTML = markup;
    if (!dlg.open) dlg.showModal();
  }

  function closeDialog() {
    if (dlg.open) dlg.close();
    dialogState = null;
  }

  function dialogError(message, field) {
    // A failure can arrive after the dialog closed: the write is in, the reload
    // of the state is not. Inside a closed dialog nothing is visible, so such a
    // message goes to the notice bar, which outlives the dialog.
    if (!dlg.open) { showNotice(message); return; }
    var box = dlg.querySelector('.dlg-error');
    if (box) box.textContent = message;
    if (field) fieldError(field, message);
  }

  function dialogButtons(confirmLabel) {
    return '<p id="dlg-error" class="dlg-error" role="alert"></p>'
      + '<div class="dlg-actions"><button type="button" class="ghost-btn" data-dlg="cancel">Cancel</button>'
      + '<button type="submit" class="action-btn action-btn-primary">' + esc(confirmLabel) + '</button></div>';
  }

  // The accept dialog: the statement as it stands (never editable here), the
  // one required sentence, and the check questions still open on its question,
  // each with the `#seq` of the log entry that asked it. Accepting with some
  // open is allowed, so the button says so; the log records which were open.
  function openAcceptDialog(questionId, hash) {
    var found = findStatement(state, questionId, hash);
    if (!found) {
      showNotice('That statement is no longer on the canvas; reloading.');
      refreshState();
      return;
    }
    var checks = found.question.openChecks || [];
    var checksHtml = checks.length
      ? '<section class="dlg-checks" aria-labelledby="dlg-checks-title"><h3 id="dlg-checks-title">Open questions from the check</h3>'
        + '<ul>' + checks.map(function (c) { return '<li><span class="seq">#' + esc(c.seq) + '</span>' + esc(c.body) + '</li>'; }).join('') + '</ul>'
        + '<p>You can accept anyway. The record notes which of these were still open.</p></section>'
      : '';
    showDialog('<form id="dlg-form" novalidate>'
      + '<h2 id="dlg-title">Accept this statement</h2>'
      + '<p class="dlg-sub">' + esc(found.question.id) + ' &middot; ' + esc(found.question.text) + '</p>'
      + '<blockquote class="dlg-quote">' + esc(found.statement.text) + '</blockquote>'
      + '<label>In your own words, why does this hold? <span class="dlg-hint">(required, one sentence)</span>'
      + '<textarea name="explained" rows="2" autofocus aria-required="true" aria-describedby="dlg-error"></textarea></label>'
      + '<label>Why accept it now? <span class="dlg-hint">(optional)</span><input type="text" name="why"></label>'
      + checksHtml
      + dialogButtons(checks.length ? 'Accept anyway' : 'Accept')
      + '</form>', { kind: 'accept', questionId: questionId, hash: hash });
  }

  // The choose dialog: a required reason, and what is set aside, prefilled
  // with the other framings and their lenses and open to edit.
  function openChooseDialog(name) {
    var variants = variantsOf(state);
    var v = variants.filter(function (x) { return x.name === name; })[0];
    if (!v) return;
    showDialog('<form id="dlg-form" novalidate>'
      + '<h2 id="dlg-title">Choose the &ldquo;' + esc(v.name) + '&rdquo; framing</h2>'
      + '<p class="dlg-sub">' + (v.lens ? 'Lens: ' + esc(v.lens) + '. ' : '') + 'Its statements replace the main canvas. The other framings stay in place as the record of what was compared.</p>'
      + '<label>Why this framing? <span class="dlg-hint">(required)</span>'
      + '<textarea name="why" rows="2" autofocus aria-required="true" aria-describedby="dlg-error"></textarea></label>'
      + '<label>What you are setting aside <span class="dlg-hint">(filled in from the other framings; edit as you like)</span>'
      + '<textarea name="rejected" rows="3">' + esc(defaultRejected(variants, v.name)) + '</textarea></label>'
      + dialogButtons('Choose this framing')
      + '</form>', { kind: 'choose', name: v.name });
  }

  function submitDialog(form) {
    var what = dialogState;
    if (!what || dialogBusy) return;
    var field = function (name) { return form.elements[name] ? String(form.elements[name].value).trim() : ''; };
    var payload;
    var path;
    if (what.kind === 'accept') {
      var explained = field('explained');
      if (!explained) { dialogError('Say in your own words why this holds. The record keeps it.', form.elements.explained); return; }
      payload = { questionId: what.questionId, expectedHash: what.hash, explained: explained };
      if (field('why')) payload.why = field('why');
      path = '/api/accept';
    } else {
      var why = field('why');
      if (!why) { dialogError('Say why you choose this framing. The record keeps it.', form.elements.why); return; }
      payload = { name: what.name, why: why };
      if (field('rejected')) payload.rejected = field('rejected');
      path = '/api/choose';
    }
    if (fixtureMode) { dialogError('Fixture mode: nothing is written.'); return; }
    if (!token) { dialogError(LINK_USED); return; }
    dialogBusy = true;
    post(path, payload).then(function (res) {
      dialogBusy = false;
      if (res.status === 200 && res.json && res.json.ok) {
        closeDialog();
        // The chosen framing is now the main canvas: show it.
        if (what.kind === 'choose') activeView = 'poster';
        return refreshState(what.kind === 'accept' ? tagMoved(what) : null).then(focusActiveHeading);
      }
      if (res.status === 409) {
        closeDialog();
        showNotice('The canvas changed since this view loaded; reloading.');
        return refreshState().then(focusActiveHeading);
      }
      dialogError((res.json && res.json.error) || ('Request failed (' + res.status + ').'), form.elements[what.kind === 'accept' ? 'explained' : 'why']);
    }).catch(function (err) {
      dialogBusy = false;
      dialogError('Request failed: ' + err.message, form.elements[what.kind === 'accept' ? 'explained' : 'why']);
    });
  }

  function clearFieldError(event) {
    event.target.removeAttribute('aria-invalid');
    var box = document.getElementById(event.target.getAttribute('aria-describedby'));
    if (box) box.textContent = '';
  }

  app.addEventListener('input', clearFieldError);
  dlg.addEventListener('input', clearFieldError);

  dlg.addEventListener('submit', function (event) {
    event.preventDefault();
    submitDialog(event.target);
  });
  dlg.addEventListener('click', function (event) {
    if (event.target.closest('[data-dlg="cancel"]')) closeDialog();
  });
  // A native close event is queued: reopening before it arrives must keep the new state.
  dlg.addEventListener('close', function () { if (!dlg.open) dialogState = null; });

  // Fixture mode only: `?view=<view>` and `?dialog=choose:<name>` or
  // `?dialog=accept:<question id>` open a view or a dialog on load, so a
  // screenshot of either needs no click. Nothing is written in fixture mode.
  function openFromUrl() {
    if (!fixtureMode) return;
    var spec = (qs.get('dialog') || '').split(':');
    if (spec[0] === 'choose' && spec[1]) openChooseDialog(spec[1]);
    if (spec[0] === 'accept' && spec[1]) {
      var target = null;
      state.elements.forEach(function (e) {
        e.questions.forEach(function (q) {
          if (q.id !== spec[1]) return;
          q.statements.forEach(function (st) {
            if (!target && ['proposed', 'tentative', 'stated'].indexOf(st.marker) !== -1) target = st;
          });
        });
      });
      if (target) openAcceptDialog(spec[1], target.hash);
    }
  }

  function onClick(event) {
    var byBtn = event.target.closest('button[data-by]');
    if (byBtn) { setByFilter(byBtn.getAttribute('data-by') || null); return; }
    // Navigation (view switching) works in fixture mode too: it never writes.
    var navBtn = event.target.closest('[data-view-target]');
    if (navBtn) {
      event.preventDefault();
      if (presentField !== null) leavePresent();
      activeView = navBtn.getAttribute('data-view-target');
      applyActiveView();
      var scrollTo = navBtn.getAttribute('data-scroll-to');
      var target = scrollTo && document.getElementById(scrollTo);
      if (target) {
        target.scrollIntoView({ block: 'start' });
        target.focus({ preventScroll: true });
      } else {
        focusActiveHeading();
      }
      return;
    }
    var btn = event.target.closest('button[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    // Both dialogs open in fixture mode too; the confirm button there says
    // nothing is written.
    if (action === 'choose') { openChooseDialog(btn.getAttribute('data-variant')); return; }
    if (action === 'present') { enterPresent(); return; }
    if (action === 'present-exit') { leavePresent(); return; }
    if (action === 'present-prev') { stepPresent(-1); return; }
    if (action === 'present-next') { stepPresent(1); return; }
    // The margin's Accept opens the sentence dialog in fixture mode as well;
    // its confirm button there says nothing is written.
    if (action === 'accept') {
      openAcceptDialog(btn.getAttribute('data-question'), btn.getAttribute('data-hash'));
      return;
    }
    if (fixtureMode) return;
    if (action === 'stated') {
      doPost('/api/stated', { questionId: btn.getAttribute('data-question'), expectedHash: btn.getAttribute('data-hash') });
    } else if (action === 'comment') {
      var num = btn.getAttribute('data-element');
      var title = btn.getAttribute('data-element-title');
      var bodyInput = document.querySelector('[data-comment-body-for="' + num + '"]');
      var whyInput2 = document.querySelector('[data-comment-why-for="' + num + '"]');
      var body = bodyInput ? bodyInput.value.trim() : '';
      if (!body) { fieldError(bodyInput, 'A note needs some text.'); return; }
      var commentPayload = { ref: num + ' ' + title, body: body };
      var why2 = whyInput2 ? whyInput2.value.trim() : '';
      if (why2) commentPayload.why = why2;
      doPost('/api/comment', commentPayload, bodyInput);
    }
  }
  // The navigation handler stays the first click listener on the page.
  app.addEventListener('click', onClick);
  presentNode.addEventListener('click', onClick);
  presentNode.addEventListener('keydown', onPresentKey);
  presentNode.addEventListener('fullscreenchange', function () {
    if (presentField !== null && !document.fullscreenElement) leavePresent();
  });
  [app, presentNode].forEach(function (root) {
    root.addEventListener('focusin', function (event) { light(event, true); });
    root.addEventListener('focusout', function (event) { light(event, false); });
    root.addEventListener('mouseover', function (event) { light(event, true); });
    root.addEventListener('mouseout', function (event) { light(event, false); });
  });
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', scheduleLayout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleLayout);
  }

  // A link to a statement (`#st-3.1`) opens the page on it.
  function revealById(id) {
    var target = document.getElementById(id);
    if (!target) return false;
    layoutIn(app);
    if (target.scrollIntoView) target.scrollIntoView({ block: 'center' });
    if (target.focus) target.focus({ preventScroll: true });
    return true;
  }

  function scrollToLinked() {
    var linked = STATEMENT_HASH.exec(location.hash);
    if (linked) revealById(linked[1]);
  }

  // The app's agent column asks for a statement by number (a link in the
  // agent's reply). Hidden statements are not shown, so they are not found.
  function lookupStatement(num) {
    if (!state) return null;
    for (var a = 0; a < state.elements.length; a++) {
      var qs = state.elements[a].questions;
      for (var b = 0; b < qs.length; b++) {
        for (var c = 0; c < qs[b].statements.length; c++) {
          var st = qs[b].statements[c];
          if (statementNumber(qs[b], c) !== num || st.hidden) continue;
          var words = String(st.text || '').trim().split(/\s+/).filter(Boolean);
          return words.length > 8 ? words.slice(0, 8).join(' ') + ' …' : words.join(' ');
        }
      }
    }
    return null;
  }

  // Embedded in the app's shell page, the view takes its token from the shell
  // instead of redeeming a code; opened alone, it redeems its own code. The
  // shell speaks to it by message, from this origin and this frame's parent
  // only: any other sender changes nothing. The shell's tab names are the
  // protocol's; the view's own ids for them are below.
  var SHELL_TABS = { 'poster': 'poster', 'to-talk-about': 'agenda', 'history': 'log' };

  function showTab(tab) {
    if (!Object.prototype.hasOwnProperty.call(SHELL_TABS, tab)) return;
    if (presentField !== null) leavePresent();
    activeView = SHELL_TABS[tab];
    applyActiveView();
  }

  function listenToShell(onToken) {
    if (typeof window === 'undefined' || !window.addEventListener || window.parent === window) return false;
    window.addEventListener('message', function (event) {
      if (event.origin !== window.location.origin || event.source !== window.parent) return;
      var msg = event.data || {};
      if (msg.type === 'harness-token' && typeof msg.token === 'string') onToken(msg.token);
      if (msg.type === 'harness-tab') showTab(msg.tab);
      if (msg.type === 'harness-refresh') {
        refreshState().catch(function (err) { showNotice('Could not reload the canvas: ' + err.message); });
      }
      if (msg.type === 'harness-reveal' && typeof msg.num === 'string') {
        showTab('poster');
        revealById('st-' + msg.num);
      }
      if (msg.type === 'harness-lookup' && typeof msg.num === 'string') {
        window.parent.postMessage({ type: 'harness-lookup-result', id: msg.id, words: lookupStatement(msg.num) }, window.location.origin);
      }
    });
    window.parent.postMessage({ type: 'harness-ready' }, window.location.origin);
    return true;
  }

  if (!fixtureMode && !listenToShell(function (shellToken) { token = shellToken; })) openSession();
  if (qs.get('view')) activeView = qs.get('view');
  var linkedAtLoad = STATEMENT_HASH.exec(location.hash);
  refreshState().then(openFromUrl).then(function () { if (linkedAtLoad) scrollToLinked(); }).catch(function (err) {
    app.innerHTML = '<p role="alert" class="load-message">Could not load the canvas: ' + esc(err.message) + '</p>';
  });
})();
</script>
</body>
</html>
